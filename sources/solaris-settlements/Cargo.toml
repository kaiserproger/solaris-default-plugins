[package]
name = "solaris-settlements-plugin"
description = "Solaris Settlements WebAssembly component source."
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
solaris-plugin-sdk = { path = "../../../solaris/sdk/rust/solaris-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
