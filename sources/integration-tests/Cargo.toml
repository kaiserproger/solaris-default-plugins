[package]
name = "solaris-plugin-integration-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
mc-plugin-host = { path = "../../../solaris/crates/mc-plugin-host" }
mc-script = { path = "../../../solaris/crates/mc-script" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }

# Tests compile the shipped Wasm components with Wasmtime; unoptimized
# dependencies make that slow and memory-heavy (same policy as the core repo).
[profile.dev.package."*"]
opt-level = 2
